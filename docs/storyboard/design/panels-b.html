<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ことづて 案B：操作パネル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
:root {
  /* ── 色：option-b.html と同じ（中立の灰色＋強い差し色1つ（藍）） ── */
  --c-ink: #14181F;           /* 本文 */
  --c-ink-2: #48505C;         /* 補足・アイコン */
  --c-ink-3: #636B77;         /* ラベル・控えめ（白地で 5.3:1） */
  --c-bg: #FFFFFF;            /* パネル・帯 */
  --c-bg-2: #F5F6F8;          /* 面（地図の地色と同じ） */
  --c-bg-3: #EDEFF3;          /* 押せる面・区切りの面 */
  --c-line: #E2E5EA;          /* 罫線 */
  --c-line-strong: #C9CED6;   /* 強い罫線・未達の破線 */
  --c-glass: rgba(255,255,255,.94);   /* 地図の上の白（出典） */
  --c-glass-2: rgba(255,255,255,.86); /* 地図の上の白（縮尺） */
  --c-accent: #3B3FC9;        /* 差し色（藍）：ルート・主ボタン・選択 */
  --c-accent-strong: #23267F; /* 濃い藍：トンネル・到着・地物の印 */
  --c-accent-soft: #ECEDFB;   /* 淡い藍の面 */
  --c-accent-ink: #2E31A6;    /* 淡い面の上の藍の文字 */
  --c-on-accent: #FFFFFF;     /* 藍の上の文字・アイコン */
  --c-pass: #12703F;  --c-pass-bg: #E7F5EC;  --c-pass-line: #A9D9BC;  /* 合格・0件で問題なし：✓・実線 */
  --c-fail: #B4231B;  --c-fail-bg: #FCEBEA;  --c-fail-line: #F1B5B0;  /* 不合格・止める：✕・実線 */
  --c-unk: #8A5300;   --c-unk-bg: #FFF5E0;   --c-unk-line: #D9A54C;   /* 判定不能・注意：？・破線 */
  --c-unk-stripe-a: #FFFBF2;  --c-unk-stripe-b: #FFF6E6;              /* 判定不能の行：斜線の背景 */
  --c-map-unk: #B26B00;       /* 地図上の判定不能区間（点線） */
  --c-story: #10131A;         /* 絵コンテの層（シートの地） */
  --c-story-line: #485061;    /* 絵コンテの層の枠線 */
  --c-story-ink: #F3F4F6;     /* 絵コンテの層の文字 */
  --c-story-ink-2: #AEB5C0;   /* 絵コンテの層の補足（地に対して 9:1） */
  /* ── このシートで足した色 ── */
  --c-scrim: rgba(16,19,26,.58);  /* ダイアログの後ろの暗幕 */
  --c-desk: #DCE0E6;              /* 別ブラウザを置く机の面 */

  /* ── 角丸 ── */
  --r-xs: 4px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  /* ── 影 ── */
  --sh-1: 0 1px 2px rgba(16,19,26,.06), 0 1px 1px rgba(16,19,26,.04);    /* 面の小さな浮き */
  --sh-2: 0 6px 20px rgba(16,19,26,.10), 0 1px 3px rgba(16,19,26,.08);   /* 地図の上の部品 */
  --sh-3: 0 10px 28px rgba(16,19,26,.28);                                 /* 絵コンテの注記 */
  --sh-panel: 1px 0 0 var(--c-line), 8px 0 24px rgba(16,19,26,.06);      /* 左のパネル */
  --sh-focus: 0 0 0 3px var(--c-accent-soft);                              /* 入力中の欄の輪 */
  --sh-dlg: 0 18px 48px rgba(16,19,26,.32), 0 2px 6px rgba(16,19,26,.18); /* ダイアログ・別ウィンドウ */
  /* ── 余白（4の倍数。h は詰めた部品用の半段） ── */
  --sp-0: 2px; --sp-1: 4px; --sp-1h: 6px; --sp-2: 8px; --sp-2h: 10px;
  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  /* ── 文字 ── */
  --font-sans: "IBM Plex Sans JP", "Noto Sans JP", sans-serif;
  --font-mono: "IBM Plex Mono", "Noto Sans Mono", monospace;
  --fs-xs: 12px;      /* ラベル・出典 */
  --fs-sm: 13px;      /* ボタン・チップ */
  --fs-md: 14px;      /* 本文 */
  --fs-lg: 15px;      /* 入力欄 */
  --fs-xl: 16px;      /* 見出し */
  --fs-brand: 19px;   /* ロゴ */
  --fs-caption: 18px; /* 絵コンテの字幕 */
  --fs-num: 22px;     /* 件数の大きな数字 */
  --lh: 1.55; --lh-tight: 1.35;
  --ls-label: .08em;  /* 小さなラベルの字間 */
  /* ── 寸法 ── */
  --bar-h: 56px; --panel-w: 440px;
  --h-chip: 30px; --h-step: 32px; --h-btn: 34px; --h-row: 38px; --h-ctl: 38px; --h-tag: 22px;
  --h-field: 38px;    /* 入力欄 */
  --mk: 18px;         /* 地図の上の地物の印 */
  /* ── シートの割り付け（1600×1000） ── */
  --sheet-x: 24px;    /* 左右の余白 */
  --sheet-gap: 20px;  /* パネルの間 */
  --row1-h: 460px; --row2-h: 376px;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--c-story); }
body {
  font-family: var(--font-sans); color: var(--c-ink); font-size: var(--fs-md); line-height: var(--lh);
  line-break: strict; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
p, h2, h3, figure { margin: 0; }
svg { display: block; flex: none; }
.mono { font-family: var(--font-mono); }
.nw { white-space: nowrap; }

/* ── シート ── */
.sheet { width: 1600px; height: 1000px; padding: 0 var(--sheet-x); overflow: hidden; }
.sh-head { height: 48px; display: flex; align-items: center; gap: var(--sp-3); color: var(--c-story-ink); border-bottom: 1px solid var(--c-story-line); }
.sh-head .t { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .02em; }
.sh-head .s { font-size: var(--fs-sm); color: var(--c-story-ink-2); }
.sh-head .note { margin-left: auto; font-size: var(--fs-xs); color: var(--c-story-ink-2); border: 1px dashed var(--c-story-line); border-radius: var(--r-xs); padding: var(--sp-0) var(--sp-2); }
.mark { width: 26px; height: 26px; border-radius: var(--r-sm); background: var(--c-accent); color: var(--c-accent); display: grid; place-items: center; flex: none; }
.mark .b { fill: var(--c-on-accent); }
.r { display: flex; gap: var(--sheet-gap); }
.r1 { margin-top: var(--sp-3); } .r2 { margin-top: var(--sp-5); }
.item figcaption { height: 22px; margin-bottom: var(--sp-2); display: flex; align-items: center; gap: var(--sp-2); color: var(--c-story-ink); font-size: var(--fs-md); font-weight: 600; white-space: nowrap; }
.item figcaption .no { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 var(--sp-1h); border-radius: var(--r-pill); background: var(--c-bg); color: var(--c-accent-strong); font-size: var(--fs-xs); font-weight: 700; }
.card { position: relative; background: var(--c-bg); border-radius: var(--r-md); overflow: hidden; }
.r1 .card { height: var(--row1-h); } .r2 .card { height: var(--row2-h); }
.pbody { padding: var(--sp-4) var(--sp-5); }

/* ── option-b.html と同じ部品 ── */
.bar { height: var(--bar-h); background: var(--c-bg); border-bottom: 1px solid var(--c-line); display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4) 0 var(--sp-5); }
.brand { display: flex; align-items: center; gap: var(--sp-2h); font-size: var(--fs-brand); font-weight: 700; letter-spacing: .04em; margin-right: var(--sp-2); }
.brand .mark { width: 30px; height: 30px; }
.chip { display: inline-flex; align-items: center; gap: var(--sp-1h); height: var(--h-chip); padding: 0 var(--sp-3) 0 var(--sp-2h); border: 1px solid var(--c-line); border-radius: var(--r-pill);
  font-size: var(--fs-sm); color: var(--c-ink-2); background: var(--c-bg); white-space: nowrap; }
.chip svg { color: var(--c-ink-3); }
.sec + .sec { margin-top: var(--sp-4); }
.eyebrow { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-xs); font-weight: 600; color: var(--c-ink-3); letter-spacing: var(--ls-label); margin-bottom: var(--sp-1h); white-space: nowrap; }
.eyebrow .meta { font-weight: 400; letter-spacing: 0; }
.ask { border: 1px solid var(--c-line-strong); border-radius: var(--r-md); background: var(--c-bg); box-shadow: var(--sh-1); overflow: hidden; }
.ask .field { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-2h) var(--sp-2h) var(--sp-2h) var(--sp-3); }
.ask .text { flex: 1; font-size: var(--fs-lg); line-height: 1.5; font-weight: 500; color: var(--c-ink); }
.ask .go { width: var(--h-btn); height: var(--h-btn); border-radius: var(--r-sm); background: var(--c-bg-3); color: var(--c-ink-2); display: grid; place-items: center; flex: none; }
.ask .read { background: var(--c-bg-2); border-top: 1px solid var(--c-line); padding: var(--sp-2) var(--sp-3) var(--sp-2h); }
.ask .read .k { font-size: var(--fs-xs); font-weight: 600; color: var(--c-accent-ink); letter-spacing: .06em; font-feature-settings: "palt"; display: flex; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-0); }
.ask .ln { color: var(--c-ink-2); font-feature-settings: "palt"; line-height: 1.6; }
.ask .ln b { font-weight: 600; color: var(--c-ink); }
code { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--c-ink); background: var(--c-bg); border: 1px solid var(--c-line); border-radius: var(--r-xs); padding: 0 var(--sp-1); white-space: nowrap; }
.tbl { border: 1px solid var(--c-line); border-radius: var(--r-md); overflow: hidden; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1h); height: var(--h-btn); padding: 0 var(--sp-3); border-radius: var(--r-sm); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap;
  border: 1px solid var(--c-line-strong); background: var(--c-bg); color: var(--c-ink); }
.btn svg { color: var(--c-ink-2); }
.btn.primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-on-accent); font-weight: 600; }
.btn.primary svg { color: inherit; }
.btn.quiet { color: var(--c-ink-2); }
.ml { position: absolute; z-index: 1; display: inline-flex; align-items: center; gap: var(--sp-1h); height: var(--h-chip); padding: 0 var(--sp-2h) 0 var(--sp-1); border-radius: var(--r-pill);
  background: var(--c-bg); box-shadow: var(--sh-2); font-size: var(--fs-md); font-weight: 600; white-space: nowrap; }
.ml .tag { display: inline-flex; align-items: center; height: var(--h-tag); padding: 0 var(--sp-2); border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 600; }
.ml.start .tag, .ml.addr .tag { background: var(--c-accent-soft); color: var(--c-accent-ink); }
.ml.goal .tag { background: var(--c-accent-strong); color: var(--c-on-accent); }
.attr { position: absolute; right: var(--sp-2); bottom: var(--sp-2); z-index: 2; background: var(--c-glass); border: 1px solid var(--c-line); border-radius: var(--r-sm);
  padding: var(--sp-1) var(--sp-2h); font-size: var(--fs-xs); line-height: 1.5; color: var(--c-ink-2); text-align: right; white-space: nowrap; box-shadow: var(--sh-1); }
.attr .d { color: var(--c-ink-3); font-variant-numeric: tabular-nums; }
.map { position: relative; background-color: var(--c-bg-2); background-repeat: no-repeat; }

/* ── 1 最初の画面 ── */
.ph { color: var(--c-ink-3); font-weight: 400; display: flex; align-items: center; min-height: 45px; align-self: stretch; }
.caret { width: 1.5px; height: 20px; background: var(--c-accent); margin-right: var(--sp-0); }
.ask .go.off { background: var(--c-bg-3); color: var(--c-ink-3); }
.ask .hint { display: flex; justify-content: space-between; border-top: 1px solid var(--c-line); background: var(--c-bg-2); padding: var(--sp-1h) var(--sp-3); font-size: var(--fs-xs); color: var(--c-ink-3); }
.ex { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2); }
.ex .chip { color: var(--c-ink); border-color: var(--c-line-strong); box-shadow: var(--sh-1); }
.ex .chip .op { font-size: var(--fs-xs); font-weight: 600; color: var(--c-accent-ink); background: var(--c-accent-soft); border-radius: var(--r-pill); padding: 0 var(--sp-1h); line-height: 18px; }
.ops { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.ops div { display: flex; align-items: center; gap: var(--sp-2); height: 40px; padding: 0 var(--sp-2h); border: 1px solid var(--c-line); border-radius: var(--r-sm); background: var(--c-bg-2); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.ops svg { color: var(--c-accent); }
.ops .l { color: var(--c-ink-3); font-weight: 600; font-size: var(--fs-xs); }

/* ── 2 住所の結果 ── */
.addr-main { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .02em; line-height: 1.4; white-space: nowrap; }
.prec { margin-top: var(--sp-1h); display: inline-flex; align-items: center; gap: var(--sp-1h); height: 26px; padding: 0 var(--sp-2h) 0 var(--sp-2); border-radius: var(--r-pill);
  background: var(--c-accent-soft); color: var(--c-accent-ink); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; }
.h3 { font-size: var(--fs-md); font-weight: 700; margin-bottom: var(--sp-1h); white-space: nowrap; }
.cand .row { display: grid; grid-template-columns: 22px 1fr 16px; align-items: center; column-gap: var(--sp-2h); height: 34px; padding: 0 var(--sp-2h) 0 var(--sp-2h); white-space: nowrap; }
.cand .row + .row { border-top: 1px solid var(--c-line); }
.cand .row .k { color: var(--c-ink-2); font-weight: 400; }
.num { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--c-accent); color: var(--c-accent-ink); font-size: var(--fs-xs); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.cand svg { color: var(--c-ink-3); }
.q { margin-top: var(--sp-2); display: flex; align-items: center; gap: var(--sp-1h); white-space: nowrap; color: var(--c-ink-2); }
.q b { color: var(--c-accent-ink); font-weight: 700; }
.q svg { color: var(--c-accent); }

/* ── 3 地物の絞り込み ── */
.p3 { display: flex; }
.p3 .pbody { width: 336px; flex: none; padding-left: var(--sp-4); padding-right: var(--sp-4); }
.p3 .map { width: 320px; flex: none; height: 100%; background-image: url(panels-b-map-filter.png); background-size: 320px 460px; border-left: 1px solid var(--c-line); }
.ask .ln.kk { display: grid; grid-template-columns: 18px 1fr; column-gap: var(--sp-1h); align-items: start; }
.ask .ln.kk > svg { margin-top: var(--sp-1); }
.tg { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-1) 0 var(--sp-1h) var(--sp-6); font-size: var(--fs-sm); color: var(--c-ink-2); white-space: nowrap; }
.sw { width: 32px; height: 18px; border-radius: var(--r-pill); background: var(--c-line-strong); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--c-bg); box-shadow: var(--sh-1); }
.tg .st { font-size: var(--fs-xs); color: var(--c-ink-3); border: 1px solid var(--c-line-strong); border-radius: var(--r-xs); padding: 0 var(--sp-1); line-height: 16px; background: var(--c-bg); }
.res { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: var(--sp-3); margin-top: var(--sp-1); font-size: var(--fs-xs); color: var(--c-ink-2); white-space: nowrap; }
.legend span { display: inline-flex; align-items: center; gap: var(--sp-1); }
.cov { margin-top: var(--sp-2h); display: inline-flex; align-items: center; gap: var(--sp-2); height: 28px; padding: 0 var(--sp-2h); border-radius: var(--r-pill);
  background: var(--c-unk-bg); color: var(--c-unk); border: 1.5px dashed var(--c-unk-line); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meter { width: 36px; height: 6px; border-radius: var(--r-pill); background: var(--c-bg); border: 1px solid var(--c-unk-line); overflow: hidden; }
.meter i { display: block; width: 38%; height: 100%; background: var(--c-unk); }
.zero { border: 1.5px dashed var(--c-line-strong); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3) var(--sp-2h); }
.zero .eyebrow { margin-bottom: var(--sp-1); justify-content: flex-start; gap: var(--sp-1); }
.zero p { display: flex; align-items: center; gap: var(--sp-1); font-weight: 500; white-space: nowrap; }
.zero svg { color: var(--c-ink-3); }
.mk { position: absolute; z-index: 1; width: var(--mk); height: var(--mk); margin: calc(var(--mk) / -2) 0 0 calc(var(--mk) / -2); border-radius: 50%; background: var(--c-bg); border: 2px solid var(--c-accent-strong); color: var(--c-accent-strong); display: grid; place-items: center; box-shadow: var(--sh-1); }
.mk-key { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--c-accent-strong); color: var(--c-accent-strong); display: grid; place-items: center; flex: none; background: var(--c-bg); }
.range { position: absolute; z-index: 1; left: var(--sp-2); top: var(--sp-2); display: inline-flex; align-items: center; gap: var(--sp-1h); height: 26px; padding: 0 var(--sp-2h) 0 var(--sp-2); border-radius: var(--r-pill); background: var(--c-bg); box-shadow: var(--sh-2); font-size: var(--fs-xs); font-weight: 600; color: var(--c-ink-2); white-space: nowrap; }
.inset { position: absolute; z-index: 1; left: var(--sp-2); top: 48px; width: 152px; height: 198px; border: 1px solid var(--c-ink-2); border-radius: var(--r-sm); overflow: hidden; box-shadow: var(--sh-2);
  background: var(--c-bg-2) url(panels-b-map-inset.png) 0 0 / 150px 196px no-repeat; }
.inset .lb { position: absolute; left: 0; top: 0; z-index: 2; background: var(--c-ink-2); color: var(--c-on-accent); font-size: var(--fs-xs); font-weight: 600; padding: 0 var(--sp-1h); border-bottom-right-radius: var(--r-xs); line-height: 20px; }
.zoombox { position: absolute; z-index: 1; border: 1.5px dashed var(--c-ink-2); border-radius: var(--r-xs); }
.lead { position: absolute; z-index: 1; width: 0; border-left: 1.5px dashed var(--c-ink-2); }

/* ── 4 書き出しと共有 ── */
.p4 { display: flex; }
/* 後ろの画面は地図を出さない（出典の見えない地図を作らない） */
.p4 .stage { width: 460px; flex: none; position: relative; background: var(--c-bg-2); display: grid; place-items: center; }
.p4 .stage::before { content: ""; position: absolute; inset: 0; background: var(--c-scrim); }
.dlg { position: relative; width: 436px; background: var(--c-bg); border-radius: var(--r-lg); box-shadow: var(--sh-dlg); padding: var(--sp-3) var(--sp-3) var(--sp-3); }
.dlg-h { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2h); padding-left: var(--sp-1); }
.dlg-h h3 { font-size: var(--fs-xl); font-weight: 700; white-space: nowrap; }
.dlg-h .meta { font-size: var(--fs-xs); color: var(--c-ink-3); white-space: nowrap; }
.dlg-h .x { margin-left: auto; width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--c-ink-2); }
.pv { position: relative; width: 412px; height: 216px; border: 1px solid var(--c-line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--c-bg-2) url(panels-b-map-export.png) 0 0 / 410px 214px no-repeat; }
.pv .ml { height: 26px; font-size: var(--fs-sm); box-shadow: var(--sh-1); }
.pv .ml .tag { height: 20px; }
/* 焼き込む出典：画像の一部として canvas に描く（DOM の出典ではない） */
.burn { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c-glass); border-top: 1px solid var(--c-line); padding: var(--sp-1) var(--sp-2h) var(--sp-1h); font-size: var(--fs-xs); line-height: 1.5; color: var(--c-ink-2); }
.burn span { white-space: nowrap; }
.link { margin-top: var(--sp-2h); display: flex; align-items: center; gap: var(--sp-2); }

.inp { display: flex; align-items: center; gap: var(--sp-1h); height: var(--h-field); padding: 0 var(--sp-3); border: 1px solid var(--c-line-strong); border-radius: var(--r-sm); background: var(--c-bg-2); color: var(--c-ink); white-space: nowrap; }

.win .url svg { color: var(--c-ink-3); }
.win .appbar { height: 40px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3); border-bottom: 1px solid var(--c-line); font-weight: 700; font-size: var(--fs-xl); letter-spacing: .04em; white-space: nowrap; }
.win .appbar .mark { width: 24px; height: 24px; }
.win .appbar .tagx { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0; color: var(--c-ink-2); border: 1px solid var(--c-line-strong); border-radius: var(--r-pill); padding: 0 var(--sp-2); line-height: 20px; }
.win .appbar .ro { margin-left: auto; font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0; color: var(--c-ink-3); display: inline-flex; align-items: center; gap: var(--sp-1); }
.win .same { height: 34px; display: flex; align-items: center; gap: var(--sp-1h); padding: 0 var(--sp-3); background: var(--c-accent-soft); color: var(--c-accent-ink); font-size: var(--fs-md); font-weight: 600; white-space: nowrap; }
.win .map { height: 224px; background-image: url(panels-b-map-share.png); background-size: 378px 224px; }

/* ── 5 OSMノートの下書き ── */
.form { display: grid; grid-template-columns: 64px 1fr; column-gap: var(--sp-3); row-gap: var(--sp-2h); align-items: start; }

.final { margin-top: var(--sp-3); padding-top: var(--sp-3); border-top: 1px solid var(--c-line); }

/* ── 6 外部通信の記録 ── */

.net .bot { margin-top: var(--sp-1); display: flex; align-items: flex-end; justify-content: space-between; padding-left: calc(var(--sp-4) + var(--sp-1h)); }  /* アイコン幅＋間 */
.net .n { font-size: var(--fs-num); font-weight: 700; line-height: 28px; font-variant-numeric: tabular-nums; }
.net .n small { font-size: var(--fs-sm); font-weight: 600; margin-left: var(--sp-0); }
.net .dots { display: flex; gap: var(--sp-1); padding-bottom: var(--sp-1); }
.net .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--c-accent); }
.net .zero-ok { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-xs); font-weight: 600; color: var(--c-pass); padding-bottom: var(--sp-0); }

</style>
</head>

              <span class="btn quiet">閉じる</span>
              <span class="btn primary"><svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 2v7.5M4.5 6.8l3 3 3-3M2.5 12.5h10"/></svg>画像を保存</span>
            </div>
          </div>
        </div>
        <div class="desk">
          <div class="lbl"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="1.5" y="2.5" width="11" height="9" rx="1.2"/><path d="M1.5 5h11"/></svg>共有リンクを別のブラウザで開いたところ</div>
          <div class="win">
            <div class="chrome">
              <span class="dots"><i></i><i></i><i></i></span>
              <span class="url"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2.5" y="5.3" width="7" height="5" rx="1"/><path d="M4 5.3V4a2 2 0 0 1 4 0v1.3"/></svg>https://…/s/k7Q2…</span>
            </div>
            <div class="appbar">
              <span class="mark"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path class="b" d="M3 5.2A2.7 2.7 0 0 1 5.7 2.5h8.6A2.7 2.7 0 0 1 17 5.2v6.1a2.7 2.7 0 0 1-2.7 2.7H9.2l-3.9 3.3V14A2.7 2.7 0 0 1 3 11.3z"/><path d="M6.6 10.6c1.6 0 2-3.4 3.5-3.4s1.5 1.6 3.3 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="6.4" cy="10.6" r="1.3" fill="currentColor"/><circle class="b" cx="13.6" cy="8.6" r="1.2" stroke="currentColor" stroke-width="1.2"/></svg></span>
              ことづて<span class="tagx">共有リンク</span>
              <span class="ro"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.2 7S3.4 3 7 3s5.8 4 5.8 4-2.2 4-5.8 4S1.2 7 1.2 7z"/><circle cx="7" cy="7" r="1.8"/></svg>閲覧のみ</span>
            </div>
            <div class="same"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="m4.3 7.1 1.8 1.8 3.6-3.8" stroke="var(--c-on-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>同じ表示範囲・コース・ピン</div>

            <div class="map">
              <div class="ml goal" style="right: 192px; top: 5px;"><span class="tag">到着</span>東京タワー</div>
              <div class="ml start" style="left: 188px; top: 124px;"><span class="tag">出発</span>品川駅</div>
              <div class="attr">© OpenStreetMap contributors ｜ Protomaps ｜ 経路：Valhalla<br><span class="d">データ時点：OSM 2026-11-03／地図 2026-11-04</span></div>
            </div>
          </div>
        </div>
      </div>
    </figure>

    <!-- 5 OSMノートの下書き -->
    <figure class="item" style="width: 400px">
      <figcaption><span class="no">5</span>OSMノートの下書き</figcaption>
      <div class="card">
        <div class="pbody">
          <div class="eyebrow">ノートの下書き<span class="meta">アプリはOSMに送りません</span></div>
          <div class="form">
            <span class="fl">何が</span>
            <span class="inp">右折禁止の規制がOSMにない可能性</span>
            <span class="fl">どこで</span>
            <span class="inp"><svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.2 8.8a2.6 2.6 0 0 0 3.7 0l2.1-2.1a2.6 2.6 0 0 0-3.7-3.7l-.6.6"/><path d="M8.8 6.2a2.6 2.6 0 0 0-3.7 0L3 8.3A2.6 2.6 0 0 0 6.7 12l.6-.6"/></svg>交差点（OSM要素IDを添付）</span>
            <span class="fl">確認方法</span>
            <div class="radios">
              <div class="rd on"><span class="o"></span><span class="t">現地で見た</span>
                <span class="date"><span class="k">見た日</span>年 / 月 / 日<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="1.8" y="2.8" width="10.4" height="9.4" rx="1.4"/><path d="M1.8 5.8h10.4M4.6 1.5v2.4M9.4 1.5v2.4" stroke-linecap="round"/></svg></span>
              </div>
              <div class="rd"><span class="o"></span><span class="t">自分で撮った写真</span></div>
            </div>
          </div>
          <div class="warn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 2.2 14.3 13H1.7z"/><path d="M8 6.5v3" stroke-linecap="round"/><circle cx="8" cy="11.3" r=".6" fill="currentColor"/></svg>社名・「試走」などの語は入れない</div>
          <div class="final">
            <div class="flow">
              <span class="btn primary"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="4.5" y="4.5" width="7.5" height="7.5" rx="1.2"/><path d="M9.5 4.5V3.2A1.2 1.2 0 0 0 8.3 2H3.2A1.2 1.2 0 0 0 2 3.2v5.1a1.2 1.2 0 0 0 1.2 1.2h1.3"/></svg>下書きをコピー</span>
              <span class="ar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5"/></svg></span>
              <span class="btn">OSMのノート画面へ<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5h3.5V6M11.3 2.7 6.5 7.5M10 8.5v2.3a.7.7 0 0 1-.7.7H3.2a.7.7 0 0 1-.7-.7V4.7a.7.7 0 0 1 .7-.7h2.3"/></svg></span>
            </div>
            <p class="who"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="4.6" r="2.3"/><path d="M2.5 12.3c.6-2.4 2.3-3.6 4.5-3.6s3.9 1.2 4.5 3.6" stroke-linecap="round"/></svg>（投稿は現地を見た本人）</p>
          </div>
        </div>
      </div>
    </figure>

    <!-- 6 外部通信の記録（この操作の間） -->

      <figcaption><span class="no">6</span>外部通信の記録（この操作の間）</figcaption>
      <div class="card">
        <div class="pbody" style="padding-left: var(--sp-4); padding-right: var(--sp-4);">

          <div class="tbl net">
            <div class="row ok">
              <div class="top"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h4.5V7M13.3 2.7 7.5 8.5"/><path d="M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg><span class="h">api.anthropic.com</span></div>

            <div class="row">
              <div class="top"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.8"/><path d="M3.9 12.1 12.1 3.9" stroke-linecap="round"/></svg>Google のサービス</div>
              <div class="bot"><span class="zero-ok"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.2 6.3 2.5 2.5 5-5.4"/></svg>通信なし</span><span class="n">0<small>件</small></span></div>
            </div>
            <div class="row">
              <div class="top"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.8"/><path d="M3.9 12.1 12.1 3.9" stroke-linecap="round"/></svg>OSM の公開サーバ</div>
              <div class="bot"><span class="zero-ok"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.2 6.3 2.5 2.5 5-5.4"/></svg>通信なし</span><span class="n">0<small>件</small></span></div>
            </div>
          </div>
          <p class="self"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2" y="2" width="10" height="4" rx="1"/><rect x="2" y="8" width="10" height="4" rx="1"/><circle cx="4.5" cy="4" r=".6" fill="currentColor"/><circle cx="4.5" cy="10" r=".6" fill="currentColor"/></svg><span>地図・検索・ルート・住所は<wbr>自前のサーバで処理</span></p>
