<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ことづて</title>
</head>
<body>
  <!-- 自前のアイコン（絵コンテと同じ形） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 26 26"><rect width="26" height="26" rx="8" fill="#7CCFD3"/><path d="M6.5 16.5c2.6-6 6.4-1.2 9.2-6.6" fill="none" stroke="#111518" stroke-width="2.4" stroke-linecap="round"/><circle cx="18.4" cy="8.6" r="2.4" fill="#111518"/><circle cx="6.5" cy="17" r="1.6" fill="#111518"/></symbol>
      <symbol id="i-send" viewBox="0 0 18 18"><path d="M9 14V4M4.5 8.5L9 4l4.5 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-link" viewBox="0 0 18 18"><path d="M7.6 10.4a3 3 0 0 0 4.3 0l2.4-2.4a3 3 0 0 0-4.3-4.3l-.9.9M10.4 7.6a3 3 0 0 0-4.3 0L3.7 10a3 3 0 0 0 4.3 4.3l.9-.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-dl" viewBox="0 0 18 18"><path d="M9 2.5v9M5 7.8l4 3.9 4-3.9M3 14.8h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-pin" viewBox="0 0 16 16"><path d="M8 14.5s5-4.4 5-8.2A5 5 0 0 0 3 6.3c0 3.8 5 8.2 5 8.2z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="6.3" r="1.7" fill="currentColor"/></symbol>
      <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 1.6l5.2 2v4.1c0 3.3-2.3 5.7-5.2 6.7-2.9-1-5.2-3.4-5.2-6.7V3.6z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.6 8l1.7 1.7L10.6 6.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div id="map" role="region" aria-label="地図"></div>

  <!-- 左上の検索（ここに日本語で頼む）、カテゴリの札、その下の結果パネル -->
  <div class="left">
    <form class="search" id="search">
      <svg class="logo" width="30" height="30" aria-hidden="true"><use href="#i-logo"/></svg>
      <label class="sr" for="q">ことづてへの依頼</label>
      <textarea id="q" rows="2" maxlength="300" placeholder="ことづてに、日本語で頼む" enterkeyhint="send"></textarea>
      <button class="send" type="submit" aria-label="送る"><svg width="18" height="18" aria-hidden="true"><use href="#i-send"/></svg></button>
    </form>
    <div class="chips" id="chips" role="toolbar" aria-label="カテゴリの札（AIを通さない）"></div>
    <section class="panel" id="panel" aria-live="polite" aria-label="結果" hidden></section>
  </div>
  <div class="banner pill" id="banner" hidden>共有された地図（読み取りのみ）</div>

  <!-- 右下：地図のボタン、状態、出典 -->
  <div class="br">
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="mapbtns">
      <button class="mb" id="locate" type="button" aria-label="現在地を使う"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="3" fill="var(--teal-600)"/><circle cx="9" cy="9" r="6.5" fill="none" stroke="var(--text-2)" stroke-width="1.5"/><path d="M9 0.8v2.6M9 14.6v2.6M0.8 9h2.6M14.6 9h2.6" stroke="var(--text-2)" stroke-width="1.5"/></svg></button>
      <div class="zoom">
        <button id="zin" type="button" aria-label="拡大"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10M7 2v10" stroke="var(--text)" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button id="zout" type="button" aria-label="縮小"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10" stroke="var(--text)" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="status">
      <span class="pill sm"><svg width="14" height="14" aria-hidden="true"><use href="#i-pin"/></svg>東京都（島しょ部を除く）</span>
      <span class="pill sm"><svg width="14" height="14" aria-hidden="true"><use href="#i-shield"/></svg><span><span class="k">外部通信：</span><span class="mono">api.anthropic.com</span> のみ</span></span>
    </div>
    <div class="attr" id="attr"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
